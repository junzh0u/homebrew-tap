name: Bump 115life

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    # hdiutil and codesign check the new DMG's app before the cask changes
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - id: bump
        run: scripts/bump-115life

      - if: steps.bump.outputs.version
        run: |
          brew style Casks/115life.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(115life): bump to ${{ steps.bump.outputs.version }}" Casks/115life.rb
          git push
